<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roommate Rally</title><style>
:root{font-family:Arial,sans-serif;color:#17324d;background:#f5f8fb;--navy:#003b71;--line:#dbe5ee;--green:#1f9d70;--gold:#e7a930;--red:#d95f59;--blue:#3978b9}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:24px 16px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.kicker{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--navy)}h1{font-size:32px;margin:8px 0}.muted{color:#64748b}.cycle{background:var(--navy);color:white;padding:11px 13px;border-radius:12px;font-size:12px}.cycle b{display:block;font-size:15px;margin-top:4px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:14px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:18px}.toolbar select,.toolbar input{padding:9px;border:1px solid var(--line);border-radius:9px;background:white;font:inherit}button{border:0;border-radius:9px;padding:9px 12px;background:#eaf0f5;color:#17324d;font-weight:600;cursor:pointer}button.primary{background:var(--navy);color:#fff}.error{color:#b33;font-size:13px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat strong{display:block;font-size:24px;margin:5px 0}.bar{height:8px;background:#e7eef4;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;border-radius:9px;transition:width .25s}.green{background:var(--green)}.gold{background:var(--gold)}.red{background:var(--red)}.blue{background:var(--blue)}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid var(--line);border-radius:11px;padding:9px;min-height:173px}.day.today{outline:2px solid var(--gold)}.day b{font-size:12px}.check{font-size:12px;display:block;margin-top:10px}.check input{accent-color:var(--green)}.step-input{width:85px;padding:4px;border:1px solid var(--line);border-radius:6px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#64748b;margin:10px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.rank{display:grid;grid-template-columns:25px 1fr auto;gap:8px;align-items:center;margin:11px 0}.avatar{border-radius:50%;background:var(--navy);color:#fff;width:24px;height:24px;display:grid;place-items:center;font-size:12px}.mini{height:6px;background:#e7eef4;border-radius:9px;margin-top:4px}.mini span{display:block;height:100%;background:var(--green);border-radius:9px}.chart{display:flex;gap:8px;height:125px;align-items:end;margin-top:10px;padding-top:5px}.col{flex:1;text-align:center;font-size:10px;color:#64748b}.col i{display:block;background:var(--blue);border-radius:5px 5px 0 0;min-height:3px}.col b{display:block;font-size:11px;color:#17324d;margin-bottom:3px}.chore{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #edf2f6;font-size:12px}.chore code{font-weight:700;color:var(--navy)}@media(max-width:800px){.head,.layout{display:block}.cycle{display:inline-block;margin-top:12px}.stats{grid-template-columns:repeat(2,1fr)}.days{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main id="app"><section class="card" style="max-width:430px;margin:12vh auto"><div class="kicker">ESADE STUDENT LIFE · GROUP BOARD</div><h1>Roommate Rally</h1><p class="muted">Enter the shared household token. Use the same token on every phone.</p><div class="toolbar"><input id="token" type="password" placeholder="Shared token" autocomplete="off" style="flex:1"><button class="primary" id="login">Open calendar</button></div><div class="error" id="login-error"></div></section></main><script>
const app=document.getElementById('app');let token=localStorage.getItem('rr-token'),state=null;const names={A:'Roommate A',B:'Roommate B',C:'Roommate C',D:'Roommate D'},days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],codes={D:'Dishwasher · whole cycle',G:'Garbage · whole cycle',V:'Vacuum shared floors',M:'Mop shared floors',B:'Own bathroom',K:'Deep clean kitchen'};function week(d=new Date()){const x=new Date(d),n=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-n);return x.toISOString().slice(0,10)}function dateFor(i){const x=new Date(week()+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+i);return x.toISOString().slice(0,10)}async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...opts.headers}});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(roommate='A'){state=await api('/api/state?roommate='+roommate);render()}document.getElementById('login').onclick=async()=>{try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.getElementById('token').value})}),j=await r.json();if(!r.ok)throw Error(j.error);token=document.getElementById('token').value;localStorage.setItem('rr-token',token);await load('A')}catch(e){document.getElementById('login-error').textContent=e.message}};function totals(){const out={};for(const p of Object.keys(names)){const rows=state.checkins.filter(x=>x.roommate===p);out[p]={attendance:rows.reduce((s,x)=>s+x.attended,0),workouts:rows.reduce((s,x)=>s+x.workout,0),food:rows.reduce((s,x)=>s+x.clean_food,0),steps:rows.reduce((s,x)=>s+x.steps,0)}}return out}function pct(v,t){return Math.min(100,Math.round(v/t*100))}function render(){const t=totals(),p=state.me,m=t[p];app.innerHTML='<div class="head"><div><div class="kicker">ESADE STUDENT LIFE · GROUP BOARD</div><h1>Roommate Rally</h1><p class="muted">Shared household token · '+state.week+' week</p></div><div class="cycle">Next review<b>Monday 20:00</b></div></div><div class="toolbar"><label>Viewing <select id="person">'+Object.entries(names).map(([k,n])=>'<option value="'+k+'" '+(k===p?'selected':'')+'>'+n+'</option>').join('')+'</select></label><button id="group" class="primary">Group overview</button><button id="logout">Log out</button></div><div class="stats"><div class="card stat"><span class="muted">Attendance</span><strong>'+m.attendance+' / 7</strong><div class="bar"><span class="green" style="width:'+pct(m.attendance,7)+'%"></span></div></div><div class="card stat"><span class="muted">Workouts</span><strong>'+m.workouts+' / 5</strong><div class="bar"><span class="blue" style="width:'+pct(m.workouts,5)+'%"></span></div></div><div class="card stat"><span class="muted">Clean food</span><strong>'+m.food+' / 7</strong><div class="bar"><span class="gold" style="width:'+pct(m.food,7)+'%"></span></div></div><div class="card stat"><span class="muted">Steps</span><strong>'+Math.round(m.steps/1000)+'k / 63k</strong><div class="bar"><span class="green" style="width:'+pct(m.steps,63000)+'%"></span></div></div></div><div class="layout"><section class="card"><h2>'+names[p]+' · weekly calendar</h2><div class="legend"><span><i class="dot green"></i>on track</span><span><i class="dot gold"></i>partial</span><span><i class="dot red"></i>needs attention</span></div><div class="days">'+days.map((d,i)=>{const row=state.checkins.find(x=>x.roommate===p&&x.day===dateFor(i))||{};return '<div class="day '+(i===0?'today':'')+'"><b>'+d+'</b><div class="muted" style="font-size:11px">'+dateFor(i).slice(5)+'</div><label class="check"><input type="checkbox" data-kind="attended" data-day="'+dateFor(i)+'" '+(row.attended?'checked':'')+'> Class attended</label><label class="check"><input type="checkbox" data-kind="workout" data-day="'+dateFor(i)+'" '+(row.workout?'checked':'')+'> Workout</label><label class="check"><input type="checkbox" data-kind="clean_food" data-day="'+dateFor(i)+'" '+(row.clean_food?'checked':'')+'> Clean food</label><label class="check">Steps <input class="step-input" data-kind="steps" data-day="'+dateFor(i)+'" type="number" min="0" max="50000" value="'+(row.steps||0)+'"></label></div>'}).join('')+'</div><p class="muted" style="font-size:12px;margin-top:12px">Steps pass at 63,000 or above. The 7,000-step margin is built in.</p></section><aside class="card"><h2>Group progress</h2><div class="chart">'+Object.keys(names).map(q=>{const s=t[q];const score=Math.round((s.attendance/7*25)+(s.workouts/5*25)+(s.food/7*20)+(Math.min(s.steps,63000)/63000*30));return '<div class="col"><b>'+Math.round(score)+'%</b><i style="height:'+Math.max(4,score)+'px"></i><span>'+names[q].split(' ')[1]+'</span></div>'}).join('')+'</div><p class="muted" style="font-size:12px">Overall completion score</p><h2>Compare roommates</h2>'+Object.keys(names).map((q,i)=>{const s=t[q],score=Math.round((s.attendance/7*25)+(s.workouts/5*25)+(s.food/7*20)+(Math.min(s.steps,63000)/63000*30));return '<div class="rank"><span class="avatar">'+(i+1)+'</span><div><b>'+names[q]+'</b><div class="mini"><span style="width:'+score+'%"></span></div></div><b>'+score+'%</b></div>'}).join('')+'<h2>Next-cycle chores</h2>'+(state.assignments.filter(x=>x.roommate===p).map(x=>'<label class="chore"><code>'+x.code+'</code><span>'+codes[x.code]+'</span><input type="checkbox" data-chore="'+x.id+'" '+(x.done?'checked':'')+'></label>').join('')||'<p class="muted">Assigned at the Monday review.</p>')+'</aside></div>';document.getElementById('person').onchange=e=>load(e.target.value);document.getElementById('group').onclick=()=>alert('Group overview is shown in the comparison panel. Choose a roommate to edit their calendar.');document.getElementById('logout').onclick=()=>{localStorage.removeItem('rr-token');location.reload()};document.querySelectorAll('input[data-kind]').forEach(el=>el.onchange=async()=>{await api('/api/checkins',{method:'PUT',body:JSON.stringify({roommate:p,day:el.dataset.day,[el.dataset.kind]:el.type==='checkbox'?el.checked:Number(el.value)})});await load(p)});document.querySelectorAll('input[data-chore]').forEach(el=>el.onchange=async()=>{await api('/api/chores/'+el.dataset.chore,{method:'PUT',body:JSON.stringify({done:el.checked})});await load(p)})}if(token)load('A').catch(()=>{localStorage.removeItem('rr-token');location.reload()});
</script></body></html>
