<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roommate Rally</title><style>
:root{font-family:Arial,sans-serif;color:#17324d;background:#f5f8fb;--navy:#003b71;--line:#dbe5ee;--green:#1f9d70;--gold:#e7a930}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:28px 18px}.head{display:flex;justify-content:space-between;gap:20px;align-items:start}.kicker{font-size:12px;letter-spacing:.1em;font-weight:700;color:var(--navy)}h1{font-size:32px;margin:8px 0}.muted{color:#64748b}.cycle{background:var(--navy);color:#fff;padding:12px;border-radius:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:14px}.login{max-width:430px;margin:12vh auto}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input{font:inherit}button{border:0;border-radius:9px;padding:9px 12px;background:#eaf0f5;color:#17324d;font-weight:600;cursor:pointer}button.primary{background:var(--navy);color:#fff}button.active{background:var(--navy);color:#fff}.tabs{margin-top:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat strong{display:block;font-size:24px;margin:5px 0}.bar{height:7px;background:#e7eef4;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}.layout{display:grid;grid-template-columns:1.4fr .9fr;gap:14px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid var(--line);border-radius:11px;padding:9px;min-height:150px}.day.today{outline:2px solid var(--gold)}.day b{font-size:12px}.check{font-size:12px;display:block;margin-top:11px}.check input{accent-color:var(--green)}.rank{display:grid;grid-template-columns:25px 1fr auto;gap:8px;align-items:center;margin:11px 0}.avatar{border-radius:50%;background:var(--navy);color:#fff;width:24px;height:24px;display:grid;place-items:center;font-size:12px}.mini{height:5px;background:#e7eef4;border-radius:9px;margin-top:4px}.mini span{display:block;height:100%;background:var(--green);border-radius:9px}.chore{display:grid;grid-template-columns:38px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #edf2f6}.chore:last-child{border:0}.chore code{font-weight:700;color:var(--navy)}.error{color:#b33;font-size:13px;margin-top:8px}@media(max-width:760px){.head,.layout{display:block}.cycle{margin-top:12px;display:inline-block}.stats{grid-template-columns:repeat(2,1fr)}.days{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main id="app"><section class="login card"><div class="kicker">ESADE STUDENT LIFE · GROUP BOARD</div><h1>Roommate Rally</h1><p class="muted">Enter your private roommate token to join the shared calendar.</p><div class="row"><input id="token" type="password" placeholder="Your token" autocomplete="off" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:9px"><button class="primary" id="login">Join</button></div><div class="error" id="login-error"></div></section></main><script>
const app=document.getElementById('app');let token=localStorage.getItem('rr-token'),me=null,state=null;const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const codes={D:'Dishwasher · whole cycle',G:'Garbage · whole cycle',V:'Vacuum shared floors',M:'Mop shared floors',B:'Own bathroom',K:'Deep clean kitchen'};function week(d=new Date()){const x=new Date(d),n=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-n);return x.toISOString().slice(0,10)}function dateFor(i){const x=new Date(week()+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+i);return x.toISOString().slice(0,10)}async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...opts.headers}});const j=await r.json();if(!r.ok)throw Error(j.error||'Something went wrong');return j}async function boot(){if(!token)return;try{state=await api('/api/state');me=state.me;render()}catch(e){localStorage.removeItem('rr-token');token=null;document.getElementById('login-error').textContent=e.message}}document.getElementById('login').onclick=async()=>{try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.getElementById('token').value})});const j=await r.json();if(!r.ok)throw Error(j.error);token=document.getElementById('token').value;localStorage.setItem('rr-token',token);await boot()}catch(e){document.getElementById('login-error').textContent=e.message}};function render(){const rows=state.checkins;const people=['A','B','C','D'];const totals=Object.fromEntries(people.map(p=>[p,{work:rows.filter(x=>x.roommate===p&&x.workout).length,steps:rows.filter(x=>x.roommate===p).reduce((s,x)=>s+x.steps,0),check:rows.filter(x=>x.roommate===p).reduce((s,x)=>s+x.attended+x.workout+x.clean_food,0)}]));const group=people.reduce((a,p)=>({work:a.work+totals[p].work,steps:a.steps+totals[p].steps,check:a.check+totals[p].check}),{work:0,steps:0,check:0});const my=totals[me];app.innerHTML='<div class="head"><div><div class="kicker">ESADE STUDENT LIFE · GROUP BOARD</div><h1>Roommate Rally</h1><p class="muted">Logged in as '+state.names[me]+' · '+state.week+' cycle</p></div><div class="cycle">Next review<strong>Monday 20:00</strong></div></div><div class="row tabs"><button class="active" id="group">Group view</button><button id="mine">My calendar</button><button id="logout">Log out</button></div><div class="stats"><div class="card stat"><span class="muted">Group check-ins</span><strong>'+group.check+'</strong><div class="bar"><span style="width:'+Math.min(100,group.check/84*100)+'%"></span></div></div><div class="card stat"><span class="muted">Workouts</span><strong>'+group.work+' / 20</strong><div class="bar"><span style="width:'+Math.min(100,group.work/20*100)+'%"></span></div></div><div class="card stat"><span class="muted">Steps</span><strong>'+Math.round(group.steps/1000)+'k / 280k</strong><div class="bar"><span style="width:'+Math.min(100,group.steps/280000*100)+'%"></span></div></div><div class="card stat"><span class="muted">Your progress</span><strong>'+my.check+'/21</strong><div class="bar"><span style="width:'+Math.min(100,my.check/21*100)+'%"></span></div></div></div><div class="layout"><section class="card"><h2>Daily check-in calendar</h2><div class="days">'+days.map((d,i)=>{const row=rows.find(x=>x.roommate===me&&x.day===dateFor(i))||{};return '<div class="day '+(i===0?'today':'')+'"><b>'+d+'</b><div class="muted" style="font-size:11px">'+dateFor(i).slice(5)+'</div><label class="check"><input type="checkbox" data-kind="attended" data-day="'+dateFor(i)+'" '+(row.attended?'checked':'')+'> Class</label><label class="check"><input type="checkbox" data-kind="workout" data-day="'+dateFor(i)+'" '+(row.workout?'checked':'')+'> Workout</label><label class="check"><input type="checkbox" data-kind="clean_food" data-day="'+dateFor(i)+'" '+(row.clean_food?'checked':'')+'> Clean food</label><label class="check">Steps <input data-kind="steps" data-day="'+dateFor(i)+'" type="number" min="0" max="50000" value="'+(row.steps||0)+'" style="width:70px;padding:4px;border:1px solid var(--line);border-radius:6px"></label></div>'}).join('')+'</div><p class="muted" style="font-size:12px;margin-top:12px">Steps pass at 63,000+ for the week. Honest check-ins beat perfect streaks.</p></section><aside class="card"><h2>Group leaderboard</h2>'+people.map((p,i)=>{const t=totals[p],score=Math.min(100,Math.round((t.check/21*70)+(Math.min(t.steps,70000)/70000*30)));return '<div class="rank"><span class="avatar">'+(i+1)+'</span><div><b>'+state.names[p]+'</b><div class="mini"><span style="width:'+score+'%"></span></div></div><b>'+score+'%</b></div>'}).join('')+'<hr><h2>My next-cycle chores</h2>'+(state.assignments.filter(x=>x.roommate===me).map(x=>'<div class="chore"><code>'+x.code+'</code><span>'+codes[x.code]+'</span><label><input type="checkbox" data-chore="'+x.id+'" '+(x.done?'checked':'')+'> done</label></div>').join('')||'<p class="muted">Assigned at Monday review.</p>')+'</aside></div>';document.getElementById('logout').onclick=()=>{localStorage.removeItem('rr-token');location.reload()};document.querySelectorAll('input[data-kind]').forEach(el=>el.onchange=async()=>{await api('/api/checkins',{method:'PUT',body:JSON.stringify({day:el.dataset.day,[el.dataset.kind]:el.type==='checkbox'?el.checked:Number(el.value)})});state=await api('/api/state');render()});document.querySelectorAll('input[data-chore]').forEach(el=>el.onchange=async()=>{await api('/api/chores/'+el.dataset.chore,{method:'PUT',body:JSON.stringify({done:el.checked})});state=await api('/api/state');render()})}boot();
</script></body></html>
